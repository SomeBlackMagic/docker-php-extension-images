[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docker-php-extension-images-render"
version = "0.1.0"
description = "Render Dockerfiles and build commands for PHP extension images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1,<9",
    "Jinja2>=3.1,<4",
]

[project.scripts]
render = "docker_render.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["docker_render"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
